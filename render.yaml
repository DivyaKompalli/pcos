services:
  - type: web
    name: pcos-anemia-api
    env: python
    buildCommand: pip install --upgrade pip wheel && pip install -r requirements.txt && python -c "from data.generate_data import main as g; g()" && python models/train_models.py
startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: GEMINI_API_KEY
        sync: false
